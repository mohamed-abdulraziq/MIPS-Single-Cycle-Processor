<!-- callouts -->
<g>
 <rect x="70" y="705" width="700" height="150" rx="16" fill="#172a3c" stroke="#efc36b" stroke-width="1.5"/>
 <text x="100" y="746" class="h">Control-flow behavior</text>
 <text x="100" y="780" class="p">PC + 4 is the default next address. BEQ selects the branch target when Zero is asserted.</text>
 <text x="100" y="810" class="p">J selects the jump target. Control outputs are generated from opcode/function decoding.</text>
 <rect x="815" y="705" width="710" height="150" rx="16" fill="#172a3c" stroke="#79bde8" stroke-width="1.5"/>
 <text x="845" y="746" class="h">Execution and write-back</text>
 <text x="845" y="780" class="p">The ALSU result can feed the register file or the data-memory interface.</text>
 <text x="845" y="810" class="p">Division_Error qualifies RegWrite; R0 writes and unsupported R-type functions are suppressed.</text>
</g>
<text x="64" y="905" class="small">Solid cyan: datapath flow   ·   Dashed gold: control signals   ·   RTL modules are the source of truth</text>
</svg>