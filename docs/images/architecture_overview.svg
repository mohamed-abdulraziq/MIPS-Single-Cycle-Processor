<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#14243a"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#203a57"/><stop offset="1" stop-color="#152a42"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#80cfff"/></marker>
 <style>
 .title{font:700 42px Arial,sans-serif;fill:#f7fbff}.sub{font:400 20px Arial,sans-serif;fill:#a9bfd5}
 .head{font:700 21px Arial,sans-serif;fill:#f5f8fc}.mod{font:16px Arial,sans-serif;fill:#c1d5e8}.desc{font:15px Arial,sans-serif;fill:#a9bfd5}
 .small{font:15px Arial,sans-serif;fill:#d6e4f0}.wire{fill:none;stroke:#80cfff;stroke-width:4;marker-end:url(#arr);stroke-linecap:round}
 .panel{fill:#13273d;stroke:#3c6488;stroke-width:2}
 </style>
</defs>
<rect width="1800" height="1000" rx="28" fill="url(#bg)"/>
<text x="70" y="78" class="title">MIPS Single-Cycle Processor</text>
<text x="70" y="116" class="sub">32-bit datapath · instruction decode · execution · memory access · write-back</text>
<g filter="url(#shadow)">
 <rect x="55" y="230" width="185" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
 <rect x="265" y="230" width="185" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
 <rect x="475" y="230" width="185" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
 <rect x="685" y="230" width="185" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
 <rect x="895" y="230" width="185" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
 <rect x="1105" y="230" width="185" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
 <rect x="1315" y="230" width="185" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
 <rect x="1525" y="230" width="220" height="155" rx="18" fill="url(#card)" stroke="#70b9e8" stroke-width="2.5"/>
</g>
<g text-anchor="middle">
 <text x="147" y="278" class="head">PC Register</text><text x="147" y="312" class="mod">PC_cntrl</text><text x="147" y="346" class="desc">32-bit state</text>
 <text x="357" y="278" class="head">Instruction Memory</text><text x="357" y="312" class="mod">instruction_mem</text><text x="357" y="346" class="desc">Byte-wide · 32-bit fetch</text>
 <text x="567" y="278" class="head">Control Unit</text><text x="567" y="312" class="mod">control_unit</text><text x="567" y="346" class="desc">Opcode / funct decode</text>
 <text x="777" y="278" class="head">Register File</text><text x="777" y="312" class="mod">Reg_file</text><text x="777" y="346" class="desc">32 × 32 · 2R / 1W</text>
 <text x="987" y="278" class="head">Operand MUX</text><text x="987" y="312" class="mod">MUX</text><text x="987" y="346" class="desc">Register / immediate</text>
 <text x="1197" y="278" class="head">ALSU</text><text x="1197" y="312" class="mod">ALSU</text><text x="1197" y="346" class="desc">13 operations</text>
 <text x="1407" y="278" class="head">Data Memory</text><text x="1407" y="312" class="mod">Data_mem</text><text x="1407" y="346" class="desc">Byte-wide · 32-bit access</text>
 <text x="1635" y="278" class="head">Write-Back MUX</text><text x="1635" y="312" class="mod">MUX</text><text x="1635" y="346" class="desc">ALSU / memory result</text>
</g>
<!-- One simple left-to-right instruction/data path -->
<path class="wire" d="M240 307H265"/><path class="wire" d="M450 307H475"/>
<path class="wire" d="M660 307H685"/><path class="wire" d="M870 307H895"/>
<path class="wire" d="M1080 307H1105"/><path class="wire" d="M1290 307H1315"/>
<path class="wire" d="M1500 307H1525"/>
<!-- Dedicated feedback path, routed well below the main chain -->
<path class="wire" d="M1635 385V485H777V385"/>
<text x="1205" y="470" class="desc" text-anchor="middle">Register write-back feedback</text>
<!-- Supporting blocks: descriptive, intentionally separated from datapath wiring -->
<text x="70" y="585" class="head">Supporting logic</text>
<g filter="url(#shadow)">
 <rect x="70" y="620" width="390" height="190" rx="18" class="panel"/>
 <rect x="495" y="620" width="390" height="190" rx="18" class="panel"/>
 <rect x="920" y="620" width="390" height="190" rx="18" class="panel"/>
 <rect x="1345" y="620" width="390" height="190" rx="18" class="panel"/>
</g>
<g text-anchor="middle">
 <text x="265" y="672" class="head">Next-PC Logic</text><text x="265" y="710" class="mod">PC_plus4 · PC_cntrl</text><text x="265" y="752" class="desc">PC + 4 · BEQ branch target</text><text x="265" y="778" class="desc">J jump target selection</text>
 <text x="690" y="672" class="head">Immediate Generation</text><text x="690" y="710" class="mod">sign_ext</text><text x="690" y="752" class="desc">16-bit immediate extended</text><text x="690" y="778" class="desc">to 32-bit operand</text>
 <text x="1115" y="672" class="head">Control Signals</text><text x="1115" y="710" class="mod">Generated by control_unit</text><text x="1115" y="752" class="desc">RegWrite · ALUControl</text><text x="1115" y="778" class="desc">MemWrite · Branch · Jump</text>
 <text x="1540" y="672" class="head">Execution Details</text><text x="1540" y="710" class="mod">ALSU / Data path</text><text x="1540" y="752" class="desc">Zero supports BEQ decision</text><text x="1540" y="778" class="desc">Division_Error qualifies RegWrite</text>
</g>
<line x1="80" y1="885" x2="155" y2="885" stroke="#80cfff" stroke-width="4"/><text x="175" y="891" class="small">Main datapath / data flow</text>
<text x="80" y="945" class="desc">High-level block view. Supporting logic is separated for readability; exact connectivity and behavior are defined by the RTL.</text>
</svg>