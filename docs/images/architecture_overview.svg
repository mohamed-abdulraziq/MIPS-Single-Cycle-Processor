<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b2b"/><stop offset="1" stop-color="#17283a"/></linearGradient>
  <linearGradient id="block" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#243b53"/><stop offset="1" stop-color="#1a2d41"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".32"/></filter>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fd3ff"/></marker>
  <marker id="arrGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#efc36b"/></marker>
  <style>
    .title{font:700 36px Arial,sans-serif;fill:#f7f9fc}.subtitle{font:400 18px Arial,sans-serif;fill:#a9bdcf}
    .h{font:700 21px Arial,sans-serif;fill:#f4f7fb}.p{font:400 15px Arial,sans-serif;fill:#cfdae5}
    .small{font:600 14px Arial,sans-serif;fill:#b8c9d8}.wire{fill:none;stroke:#8fd3ff;stroke-width:3;marker-end:url(#arr)}
    .ctrl{fill:none;stroke:#efc36b;stroke-width:2.6;stroke-dasharray:9 7;marker-end:url(#arrGold)}
    .gold{fill:#efc36b}.cyan{fill:#8fd3ff}
  </style>
</defs>
<rect width="1600" height="940" rx="24" fill="url(#bg)"/>
<text x="64" y="72" class="title">MIPS Single-Cycle Processor</text>
<text x="64" y="108" class="subtitle">32-bit datapath · instruction decode · execution · memory access · write-back</text>
<g filter="url(#shadow)">
  <rect x="70" y="190" width="190" height="108" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="310" y="172" width="240" height="145" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="600" y="172" width="220" height="145" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="865" y="172" width="240" height="145" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="1145" y="172" width="190" height="145" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="70" y="480" width="220" height="138" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="365" y="480" width="220" height="138" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="665" y="480" width="225" height="138" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="970" y="480" width="240" height="138" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
  <rect x="1280" y="480" width="245" height="138" rx="14" fill="url(#block)" stroke="#79bde8" stroke-width="2"/>
</g>
<g text-anchor="middle">
  <text x="165" y="226" class="h">PC Register</text><text x="165" y="254" class="p">PC_cntrl</text><text x="165" y="278" class="small">32-bit state</text>
  <text x="430" y="216" class="h">Instruction Memory</text><text x="430" y="250" class="p">instruction_mem</text><text x="430" y="276" class="small">Byte-wide · 32-bit fetch</text>
  <text x="710" y="216" class="h">Control Unit</text><text x="710" y="250" class="p">control_unit</text><text x="710" y="276" class="small">Opcode + function decode</text>
  <text x="985" y="216" class="h">Register File</text><text x="985" y="250" class="p">Reg_file</text><text x="985" y="276" class="small">32 × 32 · 2R / 1W</text>
  <text x="1240" y="216" class="h">ALSU</text><text x="1240" y="250" class="p">ALSU</text><text x="1240" y="276" class="small">13 operations</text>
  <text x="180" y="526" class="h">PC + 4 / Target</text><text x="180" y="560" class="p">PC_plus4</text><text x="180" y="586" class="small">Sequential / branch / jump</text>
  <text x="475" y="526" class="h">Sign Extension</text><text x="475" y="560" class="p">sign_ext</text><text x="475" y="586" class="small">16-bit → 32-bit</text>
  <text x="777" y="526" class="h">Operand MUX</text><text x="777" y="560" class="p">MUX</text><text x="777" y="586" class="small">Register / immediate</text>
  <text x="1090" y="526" class="h">Data Memory</text><text x="1090" y="560" class="p">Data_mem</text><text x="1090" y="586" class="small">Byte-wide · 32-bit access</text>
  <text x="1402" y="526" class="h">Write-Back MUX</text><text x="1402" y="560" class="p">MUX</text><text x="1402" y="586" class="small">ALSU / memory result</text>
</g>
<!-- main data paths -->
<path class="wire" d="M260 244H310"/>
<path class="wire" d="M550 244H600"/>
